<!DOCTYPE html>
<html>
  <head>
    <title>Museo AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      vr-mode-ui="enabled: false"
      loading-screen="enabled: false">

      <a-assets timeout="30000">
        <a-asset-item id="miPieza" src="./pieza1.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <!-- Esfera de referencia: si la ves, el marcador funciona -->
        <a-sphere position="0 0.05 0" radius="0.05" color="red"></a-sphere>

        <!-- Modelo 3D: empieza con escala 1 y ajusta -->
        <a-gltf-model
          src="#miPieza"
          scale="1 1 1"
          position="0 0 0"
          rotation="0 0 0">
        </a-gltf-model>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
