<!DOCTYPE html>
<html>
  <head>
    <title>Museo AR - Depuracion</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <!-- Revisa que este nombre sea EXACTO al de tu archivo en GitHub -->
        <a-asset-item id="miPieza" src="pieza1.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <!-- Esfera de referencia: si ves esto, el marcador funciona -->
        <a-sphere position="0 0 0" radius="0.05" color="red"></a-sphere>

        <!-- Tu pieza 3D -->
        <a-gltf-model 
          src="#miPieza" 
          scale="0.01 0.01 0.01" 
          position="0 0.2 0">
        </a-gltf-model>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
