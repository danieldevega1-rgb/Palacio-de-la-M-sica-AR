<a-assets>
    <!-- Agregamos crossOrigin para evitar bloqueos de seguridad -->
    <a-asset-item id="miPieza" src="./pieza1.glb" crossorigin="anonymous"></a-asset-item>
</a-assets>

<a-marker preset="hiro">
    <a-sphere position="0 0 0" radius="0.05" color="red"></a-sphere>

    <!-- Usamos un modelo más simple de prueba si el tuyo falla -->
    <a-gltf-model 
      src="#miPieza" 
      scale="0.05 0.05 0.05" 
      position="0 0.5 0"
      class="clickable"
      onclick="alert('¡Atrapado!')">
    </a-gltf-model>
</a-marker>
