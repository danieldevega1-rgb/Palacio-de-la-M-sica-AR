<!DOCTYPE html>
<html>
  <head>
    <title>Mi Museo AR - Proyecto 1</title>
    <!-- Aquí llamamos a la librería A-Frame (el motor que crea el 3D) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Aquí llamamos a AR.js (lo que permite usar la cámara) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs>
      
      <!-- Aquí es donde pondremos nuestros objetos pronto -->
<a-assets>
    <!-- El nombre en 'src' debe ser EXACTAMENTE igual al nombre de tu archivo subido -->
    <a-asset-item id="miPieza" src="pieza1.glb"></a-asset-item>
</a-assets>

<a-marker-camera preset="hiro">
    <!-- El 'scale' ajusta el tamaño. Si no lo ves, prueba con 0.1 o 0.5 -->
    <a-gltf-model src="#miPieza" scale="0.5 0.5 0.5" position="0 0 0"></a-gltf-model>
</a-marker-camera>
  </body>
</html>
